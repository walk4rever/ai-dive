name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/pi-gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Gateway tests
        run: |
          npm ci --prefix services/pi-gateway --ignore-scripts
          npm test --prefix services/pi-gateway
      - run: npm run build
